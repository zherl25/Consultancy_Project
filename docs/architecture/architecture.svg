<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 860" width="1800" height="860" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
    <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B45309"/></marker>
    <style>
      .t{fill:#0F172A;font-size:17px;font-weight:bold}
      .s{fill:#334155;font-size:13.5px}
      .m{fill:#64748B;font-size:12.5px}
      .lab{fill:#334155;font-size:12.5px}
      .box{fill:#FFFFFF;stroke:#94A3B8;stroke-width:1.5}
      .core{fill:#ECFDF5;stroke:#0F766E;stroke-width:2}
      .gen{fill:#F5F3FF;stroke:#6D28D9;stroke-width:2}
      .plan{fill:#FFFBEB;stroke:#B45309;stroke-width:2;stroke-dasharray:7 5}
      .ctr{fill:none;stroke:#64748B;stroke-width:1.5;stroke-dasharray:6 6}
      .ln{stroke:#334155;stroke-width:2;fill:none}
      .bt{fill:#FFFFFF;font-size:12px;font-weight:bold}
    </style>
  </defs>
  <rect width="1800" height="860" fill="#FFFFFF"/>
  <text x="40" y="50" font-size="30" font-weight="bold" fill="#0F172A">Consultant AI: system architecture</text>
  <text x="40" y="80" font-size="16" fill="#475569">Two Docker containers and two roles. Solid boxes are built; dashed amber boxes are planned FYP work.</text>

  <!-- Browser -->
  <rect x="40" y="150" width="250" height="380" rx="12" class="box"/>
  <text x="60" y="184" class="t">Browser</text>
  <text x="60" y="216" class="s">Consultant (admin)</text>
  <text x="60" y="234" class="m">Projects · Chat · Clients pages</text>
  <text x="60" y="266" class="s">Client company</text>
  <text x="60" y="284" class="m">Sign-up · Questionnaire page</text>
  <text x="60" y="316" class="s">Single-page app</text>
  <text x="60" y="334" class="m">vanilla JS, role-aware hash router</text>
  <text x="60" y="366" class="s">api.js</text>
  <text x="60" y="384" class="m">fetch calls with JWT (role inside)</text>
  <text x="60" y="416" class="s">Live answers</text>
  <text x="60" y="434" class="m">streamed word by word over SSE</text>
  <text x="60" y="466" class="s">Downloads</text>
  <text x="60" y="484" class="m">generated document set as zip</text>

  <!-- frontend -->
  <rect x="320" y="270" width="260" height="290" rx="14" class="ctr"/>
  <text x="335" y="292" class="m">frontend container · port 80</text>
  <rect x="340" y="310" width="220" height="230" rx="12" class="box"/>
  <text x="358" y="342" class="t">nginx</text>
  <text x="358" y="372" class="s">Serves the SPA files</text>
  <text x="358" y="402" class="s">Reverse proxy to API</text>
  <text x="358" y="420" class="m">/chat /upload /documents /health</text>
  <text x="358" y="450" class="s">SSE buffering off</text>
  <text x="358" y="476" font-size="12.5" fill="#B91C1C">Not proxied yet: /auth, /projects,</text>
  <text x="358" y="493" font-size="12.5" fill="#B91C1C">/generator, /admin</text>

  <!-- backend -->
  <rect x="610" y="110" width="880" height="680" rx="14" class="ctr"/>
  <text x="625" y="132" class="m">backend container · port 8000 · Python 3.12</text>
  <text x="630" y="158" class="t">FastAPI application (async)</text>
  <rect x="630" y="168" width="840" height="38" rx="8" fill="#F1F5F9" stroke="#CBD5E1"/>
  <text x="646" y="192" class="s">Every request: JWT + role check (admin / client) · slowapi rate limits · request ID · error handler</text>

  <g>
    <rect x="630" y="230" width="130" height="66" rx="10" class="box"/><text x="644" y="256" class="t">/auth</text><text x="644" y="278" class="m">login, sign-up</text>
    <rect x="772" y="230" width="130" height="66" rx="10" class="box"/><text x="786" y="256" class="t">/projects</text><text x="786" y="278" class="m">admin</text>
    <rect x="914" y="230" width="130" height="66" rx="10" class="box"/><text x="928" y="256" class="t">/documents</text><text x="928" y="278" class="m">admin · upload</text>
    <rect x="1056" y="230" width="130" height="66" rx="10" class="box"/><text x="1070" y="256" class="t">/chat</text><text x="1070" y="278" class="m">admin · SSE</text>
    <rect x="1198" y="230" width="130" height="66" rx="10" class="box"/><text x="1212" y="256" class="t">/generator</text><text x="1212" y="278" class="m">client</text>
    <rect x="1340" y="230" width="130" height="66" rx="10" class="box"/><text x="1354" y="256" class="t">/admin</text><text x="1354" y="278" class="m">clients, templates</text>
  </g>

  <!-- services -->
  <rect x="630" y="350" width="190" height="190" rx="12" class="core"/>
  <text x="646" y="380" class="t">Document</text><text x="646" y="400" class="t">processor</text>
  <text x="646" y="430" class="s">Parse PDF, DOCX,</text><text x="646" y="448" class="s">XLSX, TXT, MD</text>
  <text x="646" y="478" class="s">Split into chunks</text><text x="646" y="496" class="m">800 chars, 150 overlap</text>

  <rect x="845" y="350" width="190" height="190" rx="12" class="core"/>
  <text x="861" y="380" class="t">Hybrid search</text>
  <text x="861" y="410" class="s">Keywords: BM25</text><text x="861" y="428" class="m">SQLite FTS5 index</text>
  <text x="861" y="456" class="s">Meaning: MiniLM</text><text x="861" y="474" class="m">384-d vectors, cosine</text>
  <text x="861" y="502" class="s">Fused (RRF), top 6</text><text x="861" y="520" class="m">optional project filter</text>

  <rect x="1060" y="350" width="190" height="190" rx="12" class="core"/>
  <text x="1076" y="380" class="t">Chat agent</text>
  <text x="1076" y="410" class="s">Model calls a search</text><text x="1076" y="428" class="s">tool, up to 3 rounds</text>
  <text x="1076" y="458" class="s">GPT-4o or demo mode</text>
  <text x="1076" y="488" class="s">Answers only from</text><text x="1076" y="506" class="s">passages, with sources</text>

  <rect x="1275" y="350" width="190" height="190" rx="12" class="gen"/>
  <text x="1291" y="380" class="t">Document</text><text x="1291" y="400" class="t">generator</text>
  <text x="1291" y="430" class="s">Questionnaire picks</text><text x="1291" y="448" class="s">activity modules</text>
  <text x="1291" y="476" class="s">Fills master templates</text><text x="1291" y="494" class="m">numbering, cross-refs</text>
  <text x="1291" y="520" class="m">gaps flagged in yellow</text>

  <!-- planned -->
  <rect x="845" y="610" width="190" height="150" rx="12" class="plan"/>
  <text x="861" y="640" class="t" fill="#92400E">Client isolation</text><text x="861" y="660" class="t" fill="#92400E">guard</text>
  <text x="861" y="690" class="s">Client scope required</text><text x="861" y="708" class="s">on every query</text>
  <text x="861" y="738" class="m">canary leakage tests in CI</text>

  <rect x="1060" y="610" width="190" height="150" rx="12" class="plan"/>
  <text x="1076" y="640" class="t" fill="#92400E">Evaluation</text><text x="1076" y="660" class="t" fill="#92400E">harness</text>
  <text x="1076" y="690" class="s">30–50 consultant</text><text x="1076" y="708" class="s">questions</text>
  <text x="1076" y="738" class="m">Hit@6, MRR, faithfulness</text>

  <rect x="1275" y="610" width="190" height="150" rx="12" class="plan"/>
  <text x="1291" y="640" class="t" fill="#92400E">Optional</text><text x="1291" y="660" class="t" fill="#92400E">consultant sign-off</text>
  <text x="1291" y="690" class="s">Client chooses: download</text><text x="1291" y="708" class="s">now or request review</text>
  <text x="1291" y="738" class="m">approved on Clients page</text>

  <!-- right column -->
  <rect x="1530" y="150" width="240" height="120" rx="12" class="box"/>
  <text x="1548" y="182" class="t">OpenAI API</text>
  <text x="1548" y="210" class="s">gpt-4o (optional)</text>
  <text x="1548" y="236" class="m">receives the question and</text>
  <text x="1548" y="252" class="m">retrieved passages only</text>

  <path d="M1530,330 v200 a120,22 0 0 0 240,0 v-200" fill="#F8FAFC" stroke="#475569" stroke-width="1.5"/>
  <ellipse cx="1650" cy="330" rx="120" ry="22" fill="#E2E8F0" stroke="#475569" stroke-width="1.5"/>
  <text x="1548" y="380" class="t">SQLite (WAL)</text>
  <text x="1548" y="408" class="s">projects, folders</text>
  <text x="1548" y="428" class="s">documents, chunks</text>
  <text x="1548" y="448" class="s">+ FTS5 keyword index</text>
  <text x="1548" y="468" class="s">users (roles)</text>
  <text x="1548" y="488" class="s">questionnaires,</text>
  <text x="1548" y="508" class="s">generations</text>

  <rect x="1530" y="610" width="240" height="130" rx="12" class="box"/>
  <text x="1548" y="642" class="t">File storage</text>
  <text x="1548" y="670" class="s">master templates</text>
  <text x="1548" y="688" class="m">Quality Manual, procedures, forms</text>
  <text x="1548" y="714" class="s">generated sets, logos</text>
  <text x="1548" y="760" class="m">Docker volume: vector_data</text>

  <!-- arrows -->
  <line x1="290" y1="420" x2="338" y2="420" class="ln" marker-start="url(#ah)" marker-end="url(#ah)"/>
  <text x="292" y="408" class="lab">HTTP</text>
  <line x1="560" y1="420" x2="628" y2="420" class="ln" marker-end="url(#ah)"/>
  <text x="572" y="408" class="lab">proxy</text>
  <polyline points="979,296 979,318 725,318 725,348" class="ln" marker-end="url(#ah)"/>
  <polyline points="1121,296 1121,318 1155,318 1155,348" class="ln" marker-end="url(#ah)"/>
  <polyline points="1263,296 1263,318 1370,318 1370,348" class="ln" marker-end="url(#ah)"/>
  <line x1="820" y1="445" x2="843" y2="445" class="ln" marker-end="url(#ah)"/>
  <line x1="1058" y1="445" x2="1037" y2="445" class="ln" marker-end="url(#ah)"/>
  <polyline points="940,540 940,575 1490,575 1490,445 1528,445" class="ln" marker-start="url(#ah)" marker-end="url(#ah)"/>
  <line x1="1465" y1="400" x2="1528" y2="400" class="ln" marker-end="url(#ah)"/>
  <polyline points="1465,505 1510,505 1510,675 1528,675" class="ln" marker-start="url(#ah)" marker-end="url(#ah)"/>
  <polyline points="1192,350 1192,218 1500,218 1500,210 1528,210" class="ln" marker-start="url(#ah)" marker-end="url(#ah)"/>
  <line x1="940" y1="608" x2="940" y2="585" stroke="#B45309" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#aa)"/>
  <line x1="1155" y1="608" x2="1155" y2="542" stroke="#B45309" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#aa)"/>
  <line x1="1370" y1="608" x2="1370" y2="542" stroke="#B45309" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#aa)"/>

  <!-- badges -->
  <circle cx="850" cy="318" r="12" fill="#0F766E"/><text x="846" y="322.5" class="bt">1</text>
  <circle cx="832" cy="428" r="12" fill="#0F766E"/><text x="828" y="432.5" class="bt">2</text>
  <circle cx="1210" cy="575" r="12" fill="#0F766E"/><text x="1206" y="579.5" class="bt">3</text>
  <circle cx="1138" cy="318" r="12" fill="#1E40AF"/><text x="1133.5" y="322.5" class="bt">A</text>
  <circle cx="1047" cy="428" r="12" fill="#1E40AF"/><text x="1042.5" y="432.5" class="bt">B</text>
  <circle cx="1350" cy="218" r="12" fill="#1E40AF"/><text x="1345.5" y="222.5" class="bt">C</text>
  <circle cx="1316" cy="318" r="12" fill="#6D28D9"/><text x="1309" y="322.5" class="bt">G1</text>
  <circle cx="1497" cy="400" r="12" fill="#6D28D9"/><text x="1490" y="404.5" class="bt">G2</text>
  <circle cx="1510" cy="590" r="12" fill="#6D28D9"/><text x="1503" y="594.5" class="bt">G3</text>

  <!-- legend -->
  <g transform="translate(40,600)">
    <text x="0" y="0" class="t">Upload flow</text>
    <circle cx="10" cy="24" r="10" fill="#0F766E"/><text x="6.5" y="28" class="bt" font-size="11">1</text><text x="28" y="28" class="s">File into a client folder</text>
    <circle cx="10" cy="50" r="10" fill="#0F766E"/><text x="6.5" y="54" class="bt" font-size="11">2</text><text x="28" y="54" class="s">Parsed, chunked, embedded</text>
    <circle cx="10" cy="76" r="10" fill="#0F766E"/><text x="6.5" y="80" class="bt" font-size="11">3</text><text x="28" y="80" class="s">Chunks + index saved</text>
    <text x="280" y="0" class="t">Question flow</text>
    <circle cx="290" cy="24" r="10" fill="#1E40AF"/><text x="285.5" y="28" class="bt" font-size="11">A</text><text x="308" y="28" class="s">Question to /chat</text>
    <circle cx="290" cy="50" r="10" fill="#1E40AF"/><text x="286" y="54" class="bt" font-size="11">B</text><text x="308" y="54" class="s">Agent searches (≤3 rounds)</text>
    <circle cx="290" cy="76" r="10" fill="#1E40AF"/><text x="286" y="80" class="bt" font-size="11">C</text><text x="308" y="80" class="s">Answer streamed + sources</text>
    <text x="0" y="130" class="t">Document flow (client)</text>
    <circle cx="10" cy="154" r="10" fill="#6D28D9"/><text x="2" y="158" class="bt" font-size="10">G1</text><text x="28" y="158" class="s">Questionnaire answers sent to /generator</text>
    <circle cx="10" cy="180" r="10" fill="#6D28D9"/><text x="2" y="184" class="bt" font-size="10">G2</text><text x="28" y="184" class="s">Masters filled, numbered, gaps flagged; set recorded</text>
    <circle cx="10" cy="206" r="10" fill="#6D28D9"/><text x="2" y="210" class="bt" font-size="10">G3</text><text x="28" y="210" class="s">Set saved as zip; client downloads or requests sign-off</text>
  </g>
</svg>
