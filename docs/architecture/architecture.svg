<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 960" width="1600" height="960" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
    <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B45309"/></marker>
    <style>
      .t{fill:#0F172A;font-size:17px;font-weight:bold}
      .s{fill:#334155;font-size:13.5px}
      .m{fill:#64748B;font-size:12.5px}
      .lab{fill:#334155;font-size:12.5px}
      .box{fill:#FFFFFF;stroke:#94A3B8;stroke-width:1.5}
      .core{fill:#ECFDF5;stroke:#0F766E;stroke-width:2}
      .plan{fill:#FFFBEB;stroke:#B45309;stroke-width:2;stroke-dasharray:7 5}
      .ctr{fill:none;stroke:#64748B;stroke-width:1.5;stroke-dasharray:6 6}
      .ln{stroke:#334155;stroke-width:2;fill:none}
      .badge{fill:#0F766E}
      .bt{fill:#FFFFFF;font-size:13px;font-weight:bold}
    </style>
  </defs>
  <rect width="1600" height="960" fill="#FFFFFF"/>
  <text x="40" y="52" font-size="30" font-weight="bold" fill="#0F172A">Consultant AI: system architecture</text>
  <text x="40" y="82" font-size="16" fill="#475569">Two Docker containers. Solid boxes are built and working; dashed amber boxes are planned FYP contributions.</text>

  <!-- Browser -->
  <rect x="40" y="170" width="250" height="330" rx="12" class="box"/>
  <text x="60" y="205" class="t">Browser (consultant)</text>
  <text x="60" y="240" class="s">Single-page app</text>
  <text x="60" y="258" class="m">vanilla JS ES modules, no build step</text>
  <text x="60" y="292" class="s">Hash router pages</text>
  <text x="60" y="310" class="m">Landing · Login · Projects · Chat</text>
  <text x="60" y="344" class="s">api.js</text>
  <text x="60" y="362" class="m">fetch calls with JWT bearer token</text>
  <text x="60" y="396" class="s">Chat sessions</text>
  <text x="60" y="414" class="m">kept in browser localStorage</text>
  <text x="60" y="448" class="s">Live answers</text>
  <text x="60" y="466" class="m">read token-by-token over SSE</text>

  <!-- frontend container -->
  <rect x="330" y="290" width="240" height="280" rx="14" class="ctr"/>
  <text x="345" y="312" class="m">frontend container · port 80</text>
  <rect x="350" y="330" width="210" height="222" rx="12" class="box"/>
  <text x="370" y="365" class="t">nginx</text>
  <text x="370" y="398" class="s">Serves the SPA files</text>
  <text x="370" y="430" class="s">Reverse proxy to API</text>
  <text x="370" y="448" class="m">/chat /upload /documents</text>
  <text x="370" y="464" class="m">/health</text>
  <text x="370" y="490" class="s">SSE buffering off</text>
  <text x="370" y="508" class="m">so tokens stream instantly</text>
  <text x="370" y="536" font-size="12.5" fill="#B91C1C">/auth, /projects not proxied yet</text>

  <!-- backend container -->
  <rect x="610" y="110" width="660" height="790" rx="14" class="ctr"/>
  <text x="625" y="132" class="m">backend container · port 8000 · Python 3.12</text>
  <text x="630" y="166" class="t">FastAPI application (async)</text>
  <rect x="630" y="182" width="620" height="42" rx="8" fill="#F1F5F9" stroke="#CBD5E1"/>
  <text x="648" y="208" class="s">Every request: JWT check · slowapi rate limits · request ID · global error handler</text>

  <!-- routers -->
  <g>
    <rect x="630" y="250" width="140" height="72" rx="10" class="box"/>
    <text x="645" y="278" class="t">/auth</text><text x="645" y="300" class="m">login, me</text>
    <rect x="790" y="250" width="140" height="72" rx="10" class="box"/>
    <text x="805" y="278" class="t">/projects</text><text x="805" y="300" class="m">clients + 7 ISO folders</text>
    <rect x="950" y="250" width="140" height="72" rx="10" class="box"/>
    <text x="965" y="278" class="t">/upload</text><text x="965" y="300" class="m">/documents</text>
    <rect x="1110" y="250" width="140" height="72" rx="10" class="box"/>
    <text x="1125" y="278" class="t">/chat</text><text x="1125" y="300" class="m">SSE streaming</text>
  </g>
  

  <!-- services -->
  <rect x="630" y="390" width="190" height="190" rx="12" class="core"/>
  <text x="648" y="422" class="t">Document</text><text x="648" y="442" class="t">processor</text>
  <text x="648" y="472" class="s">Parse PDF, DOCX,</text><text x="648" y="490" class="s">XLSX, TXT, MD</text>
  <text x="648" y="520" class="s">Split into chunks</text><text x="648" y="538" class="m">800 chars, 150 overlap</text>

  <rect x="845" y="390" width="190" height="190" rx="12" class="core"/>
  <text x="863" y="422" class="t">Vector store</text>
  <text x="863" y="452" class="s">Embed with MiniLM</text><text x="863" y="470" class="m">384-d vectors, CPU</text>
  <text x="863" y="500" class="s">Cosine similarity</text><text x="863" y="518" class="m">NumPy, in memory</text>
  <text x="863" y="548" class="s">Top 6 passages</text><text x="863" y="566" class="m">optional client filter</text>

  <rect x="1060" y="390" width="190" height="190" rx="12" class="core"/>
  <text x="1078" y="422" class="t">Chat service</text>
  <text x="1078" y="452" class="s">Builds a prompt that</text><text x="1078" y="470" class="s">allows only the passages</text>
  <text x="1078" y="500" class="s">GPT-4o or demo mode</text>
  <text x="1078" y="530" class="s">Returns sources</text><text x="1078" y="548" class="m">with similarity scores</text>
  

  <!-- planned -->
  <rect x="630" y="700" width="190" height="150" rx="12" class="plan"/>
  <text x="648" y="732" class="t" fill="#92400E">Template</text><text x="648" y="752" class="t" fill="#92400E">generator</text>
  <text x="648" y="782" class="s">Fill Word/Excel templates</text><text x="648" y="800" class="s">from company details</text>
  <text x="648" y="830" class="m">python-docx, openpyxl</text>

  <rect x="845" y="700" width="190" height="150" rx="12" class="plan"/>
  <text x="863" y="732" class="t" fill="#92400E">Client isolation</text><text x="863" y="752" class="t" fill="#92400E">guard</text>
  <text x="863" y="782" class="s">Client scope required</text><text x="863" y="800" class="s">on every query</text>
  <text x="863" y="830" class="m">canary leakage tests in CI</text>

  <rect x="1060" y="700" width="190" height="150" rx="12" class="plan"/>
  <text x="1078" y="732" class="t" fill="#92400E">Evaluation</text><text x="1078" y="752" class="t" fill="#92400E">harness</text>
  <text x="1078" y="782" class="s">30–50 consultant</text><text x="1078" y="800" class="s">questions</text>
  <text x="1078" y="830" class="m">Hit@6, MRR, faithfulness</text>

  <!-- data + external -->
  <rect x="1310" y="190" width="250" height="130" rx="12" class="box"/>
  <text x="1330" y="224" class="t">OpenAI API</text>
  <text x="1330" y="254" class="s">gpt-4o (optional)</text>
  <text x="1330" y="282" class="m">receives only the question</text>
  <text x="1330" y="298" class="m">and the 6 retrieved passages</text>

  <path d="M1310,420 v170 a125,22 0 0 0 250,0 v-170" fill="#F8FAFC" stroke="#475569" stroke-width="1.5"/>
  <ellipse cx="1435" cy="420" rx="125" ry="22" fill="#E2E8F0" stroke="#475569" stroke-width="1.5"/>
  <text x="1330" y="470" class="t">SQLite (WAL)</text>
  <text x="1330" y="500" class="s">projects, folders</text>
  <text x="1330" y="522" class="s">documents</text>
  <text x="1330" y="544" class="s">chunks: text +</text>
  <text x="1330" y="562" class="s">embedding vectors</text>
  <text x="1310" y="640" class="m">Docker volume: vector_data</text>

  <!-- arrows -->
  <line x1="290" y1="440" x2="348" y2="440" class="ln" marker-start="url(#ah)" marker-end="url(#ah)"/>
  <text x="296" y="428" class="lab">HTTP</text>
  <line x1="560" y1="440" x2="628" y2="440" class="ln" marker-end="url(#ah)"/>
  
  <text x="572" y="430" class="lab">proxy</text>
  <!-- upload -> processor -->
  <polyline points="1020,322 1020,360 725,360 725,388" class="ln" marker-end="url(#ah)"/>
  <!-- chat -> chat service -->
  <line x1="1180" y1="322" x2="1180" y2="388" class="ln" marker-end="url(#ah)"/>
  <!-- processor -> vector -->
  <line x1="820" y1="485" x2="843" y2="485" class="ln" marker-end="url(#ah)"/>
  <!-- chat service <-> vector -->
  <line x1="1058" y1="485" x2="1037" y2="485" class="ln" marker-end="url(#ah)"/>
  <!-- vector -> sqlite -->
  <polyline points="940,580 940,630 1290,630 1290,520 1308,520" class="ln" marker-start="url(#ah)" marker-end="url(#ah)"/>
  <!-- projects -> sqlite -->
  <polyline points="860,250 860,236 1290,236 1290,440 1308,440" class="ln" stroke-dasharray="2 4" marker-end="url(#ah)"/>
  <!-- chat service -> openai -->
  <polyline points="1250,420 1285,420 1285,262 1308,262" class="ln" marker-start="url(#ah)" marker-end="url(#ah)"/>
  <!-- planned links -->
  <line x1="940" y1="698" x2="940" y2="640" stroke="#B45309" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#aa)"/>
  <line x1="725" y1="698" x2="725" y2="582" stroke="#B45309" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#aa)"/>
  <line x1="1155" y1="698" x2="1155" y2="582" stroke="#B45309" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#aa)"/>

  <!-- step badges -->
  <g>
    <circle cx="1020" cy="341" r="13" class="badge"/><text x="1015.5" y="346" class="bt">1</text>
    <circle cx="832" cy="460" r="12" class="badge"/><text x="827.5" y="465" class="bt">2</text>
    <circle cx="1115" cy="630" r="13" class="badge"/><text x="1110.5" y="635" class="bt">3</text>
    <circle cx="1180" cy="355" r="13" fill="#1E40AF"/><text x="1175.5" y="360" class="bt">A</text>
    <circle cx="1047" cy="460" r="12" fill="#1E40AF"/><text x="1042.5" y="465" class="bt">B</text>
    <circle cx="1285" cy="340" r="13" fill="#1E40AF"/><text x="1280" y="345" class="bt">C</text>
  </g>

  <!-- legend -->
  <g transform="translate(40,650)">
    <text x="0" y="0" class="t">Upload flow</text>
    <circle cx="10" cy="26" r="11" class="badge"/><text x="6" y="31" class="bt" font-size="12">1</text><text x="30" y="31" class="s">File uploaded into a client folder</text>
    <circle cx="10" cy="54" r="11" class="badge"/><text x="6" y="59" class="bt" font-size="12">2</text><text x="30" y="59" class="s">Parsed, chunked, embedded</text>
    <circle cx="10" cy="82" r="11" class="badge"/><text x="6" y="87" class="bt" font-size="12">3</text><text x="30" y="87" class="s">Chunks + vectors saved</text>
    <text x="300" y="0" class="t">Question flow</text>
    <circle cx="310" cy="26" r="11" fill="#1E40AF"/><text x="305.5" y="31" class="bt" font-size="12">A</text><text x="330" y="31" class="s">Question sent to /chat</text>
    <circle cx="310" cy="54" r="11" fill="#1E40AF"/><text x="306" y="59" class="bt" font-size="12">B</text><text x="330" y="59" class="s">Top 6 passages found</text>
    <circle cx="310" cy="82" r="11" fill="#1E40AF"/><text x="306" y="87" class="bt" font-size="12">C</text><text x="330" y="87" class="s">Answer streamed + sources</text>
  </g>
</svg>
