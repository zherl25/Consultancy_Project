# ════════════════════════════════════════════════════════════
#  Consultant AI — nginx site configuration
#
#  Responsibilities:
#    1. Serve the static frontend (HTML / CSS / JS)
#    2. Reverse-proxy API calls to the FastAPI backend service
#    3. Enable SSE (Server-Sent Events) buffering-off for streaming chat
# ════════════════════════════════════════════════════════════

upstream backend {
    server backend:8000;
    keepalive 32;              # reuse connections to the backend
}

server {
    listen 80;
    server_name _;             # catch-all — replace with your domain in production

    # ── Compression ───────────────────────────────────────
    gzip on;
    gzip_types text/plain text/css application/javascript application/json;
    gzip_min_length 1024;
    gzip_vary on;

    # ── Frontend static files ─────────────────────────────
    # Serves index.html at the root and falls back to it for SPA hash-routing.
    location / {
        root  /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # FastAPI mounts static assets under /static/; map that path to the same
    # directory so all <link href="/static/css/..."> references resolve correctly.
    location /static/ {
        alias   /usr/share/nginx/html/;
        expires 1d;
        add_header Cache-Control "public, immutable";
    }

    # ── API reverse proxy ──────────────────────────────────
    # Routes all API endpoints to the FastAPI backend container.
    # The regex matches /chat, /upload, /documents, /health (and sub-paths).
    location ~ ^/(chat|upload|documents|health)(/|$) {
        proxy_pass         http://backend;
        proxy_http_version 1.1;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # ── SSE / streaming support ────────────────────────
        # Disable buffering so chat tokens are pushed to the browser immediately.
        proxy_set_header   Connection        '';
        proxy_buffering    off;
        proxy_cache        off;
        chunked_transfer_encoding on;

        # Long timeout for streaming chat responses.
        proxy_read_timeout  300s;
        proxy_send_timeout  300s;
        proxy_connect_timeout 10s;
    }

    # ── Security headers ───────────────────────────────────
    add_header X-Content-Type-Options  "nosniff"         always;
    add_header X-Frame-Options         "SAMEORIGIN"      always;
    add_header Referrer-Policy         "strict-origin"   always;
}
