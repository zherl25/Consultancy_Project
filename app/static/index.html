<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Consultant AI</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #f7f8fa;
      --panel: #ffffff;
      --border: #e2e5ea;
      --accent: #1a56db;
      --accent-light: #eff4ff;
      --text: #111827;
      --text-muted: #6b7280;
      --danger: #dc2626;
      --radius: 10px;
      --sidebar: 280px;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      overflow: hidden;
    }

    /* ── Sidebar ── */
    #sidebar {
      width: var(--sidebar);
      min-width: var(--sidebar);
      background: var(--panel);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      padding: 20px 16px;
      gap: 16px;
    }

    #sidebar h1 {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--accent);
      letter-spacing: -0.3px;
    }

    #sidebar h2 {
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    #upload-area {
      border: 2px dashed var(--border);
      border-radius: var(--radius);
      padding: 18px 12px;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
      font-size: 0.85rem;
      color: var(--text-muted);
    }
    #upload-area:hover, #upload-area.drag-over {
      border-color: var(--accent);
      background: var(--accent-light);
      color: var(--accent);
    }
    #upload-area input { display: none; }
    #upload-area span { display: block; margin-top: 4px; font-size: 0.75rem; }

    #upload-status {
      font-size: 0.78rem;
      color: var(--text-muted);
      min-height: 18px;
    }

    #doc-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; }

    .doc-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
      border-radius: 8px;
      border: 1px solid var(--border);
      font-size: 0.82rem;
      background: var(--bg);
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
    }
    .doc-item:hover { background: var(--accent-light); border-color: var(--accent); }
    .doc-item.active { background: var(--accent-light); border-color: var(--accent); color: var(--accent); font-weight: 600; }
    .doc-item .doc-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .doc-item .del-btn {
      background: none; border: none; cursor: pointer; color: var(--text-muted);
      font-size: 1rem; line-height: 1; padding: 2px 4px; border-radius: 4px;
    }
    .doc-item .del-btn:hover { color: var(--danger); background: #fee2e2; }

    #filter-note {
      font-size: 0.75rem;
      color: var(--text-muted);
      padding: 6px 10px;
      background: var(--accent-light);
      border-radius: 8px;
      display: none;
    }

    /* ── Chat area ── */
    #chat-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    #chat-header {
      padding: 16px 24px;
      border-bottom: 1px solid var(--border);
      background: var(--panel);
      font-weight: 600;
      font-size: 0.95rem;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    #chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .msg {
      max-width: 78%;
      padding: 12px 16px;
      border-radius: 14px;
      font-size: 0.9rem;
      line-height: 1.6;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .msg.user {
      align-self: flex-end;
      background: var(--accent);
      color: #fff;
      border-bottom-right-radius: 4px;
    }
    .msg.assistant {
      align-self: flex-start;
      background: var(--panel);
      border: 1px solid var(--border);
      border-bottom-left-radius: 4px;
    }
    .msg.system-msg {
      align-self: center;
      background: transparent;
      color: var(--text-muted);
      font-size: 0.8rem;
      border: none;
      padding: 4px 0;
    }

    #input-area {
      padding: 16px 24px;
      border-top: 1px solid var(--border);
      background: var(--panel);
      display: flex;
      gap: 10px;
      align-items: flex-end;
    }

    #user-input {
      flex: 1;
      resize: none;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 0.9rem;
      font-family: inherit;
      line-height: 1.5;
      max-height: 140px;
      min-height: 44px;
      outline: none;
      transition: border-color 0.2s;
    }
    #user-input:focus { border-color: var(--accent); }

    #send-btn {
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 10px 18px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
      white-space: nowrap;
    }
    #send-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    #send-btn:hover:not(:disabled) { opacity: 0.9; }

    #new-chat-btn {
      background: none;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 6px 12px;
      font-size: 0.8rem;
      cursor: pointer;
      color: var(--text-muted);
      transition: background 0.15s;
    }
    #new-chat-btn:hover { background: var(--bg); }

    .typing-dot {
      display: inline-block;
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--text-muted);
      animation: blink 1.2s infinite;
    }
    .typing-dot:nth-child(2) { animation-delay: 0.2s; }
    .typing-dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes blink { 0%,80%,100% { opacity: 0.2; } 40% { opacity: 1; } }
  </style>
</head>
<body>

<!-- Sidebar -->
<aside id="sidebar">
  <h1>Consultant AI</h1>

  <div>
    <h2>Upload Document</h2>
    <div id="upload-area">
      <input type="file" id="file-input" accept=".pdf,.docx,.xlsx,.txt,.md" />
      <div>Click or drag &amp; drop</div>
      <span>PDF · DOCX · XLSX · TXT · MD</span>
    </div>
    <div id="upload-status"></div>
  </div>

  <div style="flex:1;display:flex;flex-direction:column;min-height:0;">
    <h2>Documents <span id="doc-count" style="font-weight:400;text-transform:none;letter-spacing:0"></span></h2>
    <div id="doc-list">
      <div class="msg system-msg">No documents yet.</div>
    </div>
  </div>

  <div id="filter-note">Filtering by selected document</div>
</aside>

<!-- Chat -->
<main id="chat-container">
  <div id="chat-header">
    <span id="chat-title">Chat</span>
    <button id="new-chat-btn" style="margin-left:auto">+ New chat</button>
  </div>

  <div id="chat-messages">
    <div class="msg system-msg">Upload documents in the sidebar, then ask questions below.</div>
  </div>

  <div id="input-area">
    <textarea id="user-input" rows="1" placeholder="Ask a question about your documents…"></textarea>
    <button id="send-btn">Send</button>
  </div>
</main>

<script>
  const chatMessages = document.getElementById('chat-messages');
  const userInput = document.getElementById('user-input');
  const sendBtn = document.getElementById('send-btn');
  const uploadArea = document.getElementById('upload-area');
  const fileInput = document.getElementById('file-input');
  const uploadStatus = document.getElementById('upload-status');
  const docList = document.getElementById('doc-list');
  const docCount = document.getElementById('doc-count');
  const filterNote = document.getElementById('filter-note');
  const chatTitle = document.getElementById('chat-title');
  const newChatBtn = document.getElementById('new-chat-btn');

  let conversation = [];   // [{role, content}]
  let activeFilter = null; // filename or null

  // ── Document list ──────────────────────────────────────────────────────────

  async function loadDocuments() {
    const res = await fetch('/documents');
    const { documents } = await res.json();
    renderDocs(documents);
  }

  function renderDocs(docs) {
    docCount.textContent = docs.length ? `(${docs.length})` : '';
    if (!docs.length) {
      docList.innerHTML = '<div class="msg system-msg">No documents yet.</div>';
      setFilter(null);
      return;
    }
    docList.innerHTML = '';
    docs.forEach(name => {
      const item = document.createElement('div');
      item.className = 'doc-item' + (name === activeFilter ? ' active' : '');
      item.dataset.name = name;
      item.innerHTML = `
        <span class="doc-name" title="${name}">${name}</span>
        <button class="del-btn" title="Remove" data-name="${name}">×</button>
      `;
      item.addEventListener('click', (e) => {
        if (e.target.classList.contains('del-btn')) return;
        setFilter(name === activeFilter ? null : name);
      });
      item.querySelector('.del-btn').addEventListener('click', () => deleteDoc(name));
      docList.appendChild(item);
    });
  }

  function setFilter(name) {
    activeFilter = name;
    filterNote.style.display = name ? 'block' : 'none';
    chatTitle.textContent = name ? `Chat — ${name}` : 'Chat';
    document.querySelectorAll('.doc-item').forEach(el => {
      el.classList.toggle('active', el.dataset.name === name);
    });
  }

  async function deleteDoc(name) {
    if (!confirm(`Remove "${name}" from the knowledge base?`)) return;
    const res = await fetch(`/documents/${encodeURIComponent(name)}`, { method: 'DELETE' });
    if (res.ok) {
      if (activeFilter === name) setFilter(null);
      await loadDocuments();
    }
  }

  // ── Upload ─────────────────────────────────────────────────────────────────

  uploadArea.addEventListener('click', () => fileInput.click());
  fileInput.addEventListener('change', () => handleFile(fileInput.files[0]));

  uploadArea.addEventListener('dragover', e => { e.preventDefault(); uploadArea.classList.add('drag-over'); });
  uploadArea.addEventListener('dragleave', () => uploadArea.classList.remove('drag-over'));
  uploadArea.addEventListener('drop', e => {
    e.preventDefault();
    uploadArea.classList.remove('drag-over');
    if (e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]);
  });

  async function handleFile(file) {
    if (!file) return;
    uploadStatus.textContent = `Uploading ${file.name}…`;
    const form = new FormData();
    form.append('file', file);
    try {
      const res = await fetch('/upload', { method: 'POST', body: form });
      const data = await res.json();
      if (!res.ok) throw new Error(data.detail || 'Upload failed');
      uploadStatus.textContent = `✓ ${data.filename} (${data.chunks_indexed} chunks)`;
      fileInput.value = '';
      await loadDocuments();
    } catch (err) {
      uploadStatus.textContent = `✗ ${err.message}`;
    }
  }

  // ── Chat ───────────────────────────────────────────────────────────────────

  function appendMessage(role, text) {
    const div = document.createElement('div');
    div.className = `msg ${role}`;
    div.textContent = text;
    chatMessages.appendChild(div);
    chatMessages.scrollTop = chatMessages.scrollHeight;
    return div;
  }

  function appendTyping() {
    const div = document.createElement('div');
    div.className = 'msg assistant';
    div.innerHTML = '<span class="typing-dot"></span><span class="typing-dot"></span><span class="typing-dot"></span>';
    chatMessages.appendChild(div);
    chatMessages.scrollTop = chatMessages.scrollHeight;
    return div;
  }

  async function sendMessage() {
    const text = userInput.value.trim();
    if (!text || sendBtn.disabled) return;

    userInput.value = '';
    userInput.style.height = 'auto';
    sendBtn.disabled = true;

    conversation.push({ role: 'user', content: text });
    appendMessage('user', text);

    const typingEl = appendTyping();

    try {
      const res = await fetch('/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ messages: conversation, document_filter: activeFilter }),
      });

      if (!res.ok) {
        const err = await res.json();
        throw new Error(err.detail || 'Request failed');
      }

      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let reply = '';
      typingEl.textContent = '';

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        const chunk = decoder.decode(value, { stream: true });
        reply += chunk;
        typingEl.textContent = reply;
        chatMessages.scrollTop = chatMessages.scrollHeight;
      }

      conversation.push({ role: 'assistant', content: reply });
    } catch (err) {
      typingEl.textContent = `Error: ${err.message}`;
      typingEl.style.color = 'var(--danger)';
    } finally {
      sendBtn.disabled = false;
      userInput.focus();
    }
  }

  sendBtn.addEventListener('click', sendMessage);
  userInput.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
  });

  // auto-resize textarea
  userInput.addEventListener('input', () => {
    userInput.style.height = 'auto';
    userInput.style.height = Math.min(userInput.scrollHeight, 140) + 'px';
  });

  newChatBtn.addEventListener('click', () => {
    conversation = [];
    chatMessages.innerHTML = '<div class="msg system-msg">New conversation started.</div>';
  });

  // ── Init ───────────────────────────────────────────────────────────────────
  loadDocuments();
</script>
</body>
</html>
